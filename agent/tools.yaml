# MCP Toolbox v1.14 configuration. No secrets; ADC supplies BigQuery identity.
kind: source
name: seattle_food_db
type: bigquery
project: ${GOOGLE_CLOUD_PROJECT}
location: US
readOnly: true
writeMode: blocked
allowedDatasets:
  - a4i_food
maxQueryResultRows: 20
maximumBytesBilled: 100000000
sqlCommenter: true
---
kind: tool
name: vector_search_recipients
type: bigquery-sql
source: seattle_food_db
description: >-
  Retrieve at most 12 Seattle recipient candidates by real BigQuery VECTOR_SEARCH.
  Results are candidates, not confirmed matches. Operational fields are dataset
  profiles and must pass the custom clock/storage/capacity tool before use.
annotations:
  readOnlyHint: true
  destructiveHint: false
statement: |
  SELECT base.* EXCEPT(embedding), distance
  FROM VECTOR_SEARCH(
    TABLE `${GOOGLE_CLOUD_PROJECT}.a4i_food.recipient_embeddings`, 'embedding',
    (SELECT AI.EMBED(@query_text, endpoint => 'gemini-embedding-2').result AS embedding),
    top_k => 12,
    distance_type => 'COSINE',
    options => '{"use_brute_force":true}'
  )
  ORDER BY distance ASC
parameters:
  - name: query_text
    type: string
    description: Validated donor offer and required storage, no SQL.
---
kind: tool
name: get_recipient_evidence
type: bigquery-sql
source: seattle_food_db
description: >-
  Read one exact recipient identifier from the existing dataset. At most two rows
  detect ambiguous duplicate identifiers. This is stored profile evidence, not
  confirmed availability, eligibility, a current match or a reservation.
annotations:
  readOnlyHint: true
  destructiveHint: false
statement: |
  SELECT CAST(recipient_id AS STRING) AS recipient_id,
         SUBSTR(CAST(name AS STRING), 1, 160) AS name,
         SUBSTR(CAST(city AS STRING), 1, 160) AS city,
         SUBSTR(CAST(zip_code AS STRING), 1, 32) AS zip_code,
         SUBSTR(CAST(archetype AS STRING), 1, 160) AS archetype,
         SUBSTR(CAST(service_days AS STRING), 1, 160) AS service_days,
         latitude, longitude, SUBSTR(CAST(cold_storage AS STRING), 1, 40) AS cold_storage,
         frozen_storage, loading_dock,
         refrigerated_transport, max_pallets, pickup_window_hours,
         weekly_households, SUBSTR(CAST(profile_source AS STRING), 1, 40) AS profile_source,
         SUBSTR(CAST(profile_text AS STRING), 1, 4000) AS profile_text,
         CHAR_LENGTH(CAST(profile_text AS STRING)) > 4000 AS profile_text_truncated,
         SUBSTR(CAST(tract_id AS STRING), 1, 100) AS tract_id,
         tract_poverty_rate, tract_no_vehicle_rate,
         tract_median_income, tract_dist_km
  FROM `${GOOGLE_CLOUD_PROJECT}.a4i_food.recipient_embeddings`
  WHERE CAST(recipient_id AS STRING) = @recipient_id
  LIMIT 2
parameters:
  - name: recipient_id
    type: string
    description: One canonical exact recipient ID, never a name, SQL, table or URL.
---
# FastAPI uses container port 8080. This source needs no auth and cannot leave loopback.
# Toolbox v1.14 checks explicit allowed ranges before custom blocked ranges.
kind: source
name: foodkeeper_loopback
type: http
baseUrl: http://127.0.0.1:8080
timeout: 5s
returnFullError: false
allowPrivateNetworks: false
allowedIpRanges:
  - 127.0.0.1/32
customBlockedIpRanges:
  - 0.0.0.0/0
  - ::/0
---
kind: tool
name: lookup_shelf_life
type: http
source: foodkeeper_loopback
method: GET
path: /api/foodkeeper
description: >-
  Read pinned FoodKeeper consumer storage guidance for one product term.
  Returns product options and unresolved product/state/history questions.
  Never determines remaining freshness, safety clearance or a pickup deadline.
annotations:
  readOnlyHint: true
  destructiveHint: false
queryParams:
  - name: query
    type: string
    description: One literal product term of 2–120 characters, not a mixed-food posting.
---
kind: tool
name: get_tract_equity
type: bigquery-sql
source: seattle_food_db
description: >-
  Read one exact Washington tract's ACS-derived starter snapshot.
  Aggregate neighborhood indicators do not establish recipient service area,
  current demand, operational availability or any individual's circumstances.
annotations:
  readOnlyHint: true
  destructiveHint: false
statement: |
  SELECT geo_id AS tract_id, tract_lat, tract_lon, total_pop, median_income,
         poverty_rate, no_vehicle_rate, assistance_rate,
         CASE WHEN poverty_rate BETWEEN 0 AND 1
                   AND no_vehicle_rate BETWEEN 0 AND 1
              THEN 0.5 * poverty_rate + 0.5 * no_vehicle_rate
              ELSE NULL END AS need_score
  FROM `${GOOGLE_CLOUD_PROJECT}.a4i_food.tract_demographics`
  WHERE geo_id = @tract_id
    AND REGEXP_CONTAINS(@tract_id, r'^53[0-9]{9}$')
  LIMIT 2
parameters:
  - name: tract_id
    type: string
    description: Exact 11-digit Washington tract ID already associated with a retrieved recipient.
