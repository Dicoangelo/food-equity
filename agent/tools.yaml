# MCP Toolbox v1.14 configuration. No secrets; ADC supplies BigQuery identity.
kind: source
name: seattle_food_db
type: bigquery
project: ${GOOGLE_CLOUD_PROJECT}
location: US
readOnly: true
writeMode: blocked
allowedDatasets:
  - a4i_food
maxQueryResultRows: 20
maximumBytesBilled: 100000000
sqlCommenter: true
---
kind: tool
name: vector_search_recipients
type: bigquery-sql
source: seattle_food_db
description: >-
  Retrieve at most 12 Seattle recipient candidates by real BigQuery VECTOR_SEARCH.
  Results are candidates, not confirmed matches. Operational fields are dataset
  profiles and must pass the custom clock/storage/capacity tool before use.
annotations:
  readOnlyHint: true
  destructiveHint: false
statement: |
  SELECT base.* EXCEPT(embedding), distance
  FROM VECTOR_SEARCH(
    TABLE `${GOOGLE_CLOUD_PROJECT}.a4i_food.recipient_embeddings`, 'embedding',
    (SELECT AI.EMBED(@query_text, endpoint => 'gemini-embedding-2').result AS embedding),
    top_k => 12,
    distance_type => 'COSINE',
    options => '{"use_brute_force":true}'
  )
  ORDER BY distance ASC
parameters:
  - name: query_text
    type: string
    description: Validated donor offer and required storage, no SQL.
