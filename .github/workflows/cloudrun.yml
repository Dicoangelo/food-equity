name: Test and deploy Seattle broker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "Dockerfile"
      - "requirements*.txt"
      - ".dockerignore"
      - ".gcloudignore"
      - ".github/workflows/cloudrun.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/test_alert_intake.js tests/test_offer_workflow.js tests/test_ui_contract.js tests/test_recipient_explorer.js tests/test_source_state.js tests/test_view_context.js tests/test_view_transport.js tests/test_companion.js
      - run: bash -n scripts/deploy_cloud_run.sh && bash -n scripts/setup_github_deploy.sh

  deploy:
    needs: test
    if: >-
      github.repository == 'niatalwalkar/food-equity' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: seattle-food-broker-production
      cancel-in-progress: false
    environment:
      name: cloud-run-production
      url: https://seattle-food-broker-6ukbp746xa-ue.a.run.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: qwiklabs-gcp-04-b992b9561e32
          workload_identity_provider: projects/803337281376/locations/global/workloadIdentityPools/food-equity-github/providers/team-main
          service_account: food-equity-deploy@qwiklabs-gcp-04-b992b9561e32.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s
          request_reason: food-equity-main-${{ github.sha }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: qwiklabs-gcp-04-b992b9561e32
      - name: Stage, verify and promote exact commit
        env:
          # A short-lived impersonated token avoids a long source build depending
          # on the five-minute GitHub OIDC assertion. No key is created.
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: >-
          bash scripts/deploy_cloud_run.sh --ci --promote
          --evidence-dir "$RUNNER_TEMP/food-equity-release"
      - name: Publish verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: cloud-run-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/food-equity-release/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Release summary
        if: always()
        env:
          RELEASE_RESULT: ${{ job.status }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Seattle broker release"
            echo "Commit: \`$RELEASE_SHA\`"
            echo "Result: $RELEASE_RESULT"
            echo "[Live app](https://seattle-food-broker-6ukbp746xa-ue.a.run.app)"
            echo "[Release identity](https://seattle-food-broker-6ukbp746xa-ue.a.run.app/api/version)"
            echo "See the JSON artifact for candidate, test and promotion receipts."
          } >> "$GITHUB_STEP_SUMMARY"
